name = "synthire-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
JWT_EXPIRY_SECONDS = "900"
REFRESH_TOKEN_EXPIRY_SECONDS = "2592000"
FRONTEND_ORIGIN = "http://localhost:3000"
MAX_UPLOAD_BYTES = "10485760"
EMAIL_PROVIDER = "sendgrid" #"resend"
RESEND_FROM_EMAIL = "onboarding@resend.dev"
RESEND_FROM_NAME = "Synthire"
SENDGRID_FROM_EMAIL = "adigaikwad4321@gmail.com"
EMAIL_QUEUE_INTERVAL_SECONDS = "30"
EMAIL_MAX_RETRIES = "3"
LLM_MODEL_PRIMARY  = "@cf/meta/llama-3.1-8b-instruct-awq"
LLM_MODEL_FALLBACK = "@cf/meta/llama-3.2-3b-instruct"
LLM_TEMPERATURE = "0.1"
LLM_MAX_TOKENS = "800"
NEURONS_DAILY_LIMIT = "10000"
LLM_LIMITS_ENABLED = "true"

# ── Quota guardrails ─────────────────────────────────────────────────────────
# Every *_ENABLED flag below is a kill switch: set "false" to stop ENFORCING
# the cap. Usage counters keep incrementing either way, so /api/analytics
# usage snapshots stay accurate while a limit is off.
# Rate limiting uses the native [[ratelimits]] binding below, not KV.
# The short-poll endpoints (candidate status, JD parse status) are exempted in
# middleware/rate-limit.ts, so batch uploads are unaffected.
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_REQUESTS = "300"          # keep in sync with [[ratelimits]] simple.limit
RATE_LIMIT_WINDOW_SECONDS = "60"     # keep in sync with [[ratelimits]] simple.period

# Login brute-force limiter (no kill switch — security control, not a quota).
LOGIN_MAX_ATTEMPTS = "5"
LOGIN_ATTEMPT_WINDOW_SECONDS = "60"

# D1 + KV daily quotas — ~90% of Workers Free, so we fail fast with a 503
# instead of hitting Cloudflare's own hard error. Resets 00:00 UTC.
# KV writes are the tightest constraint on the whole app: 1,000/day.
QUOTA_LIMITS_ENABLED = "true"
D1_MAX_ROWS_READ_DAILY = "4500000"   # free tier: 5,000,000/day
D1_MAX_ROWS_WRITTEN_DAILY = "90000"  # free tier:   100,000/day
KV_MAX_READS_DAILY = "90000"         # free tier:   100,000/day
KV_MAX_WRITES_DAILY = "900"          # free tier:     1,000/day
R2_LIMITS_ENABLED = "true"
R2_MAX_STORAGE_BYTES = "10737418240"       # 10 GB free tier
R2_MAX_CLASS_A_OPS_MONTHLY = "900000"      # 90% of 1M free Class A ops
R2_MAX_CLASS_B_OPS_MONTHLY = "9000000"     # 90% of 10M free Class B ops

# After running: wrangler d1 create synthire-prod
# Replace REPLACE_WITH_YOUR_DATABASE_ID with the output database_id
[[d1_databases]]
binding = "DB"
database_name = "synthire-prod"
database_id = "f6a8faf6-0220-4870-a66b-cbca43405762"
migrations_dir = "src/db/migrations"

# After running: wrangler r2 bucket create synthire-resumes
[[r2_buckets]]
binding = "RESUME_BUCKET"
bucket_name = "synthire-resumes"

# After running: wrangler kv:namespace create KV_CACHE
# Replace REPLACE_WITH_YOUR_KV_ID with the output id
[[kv_namespaces]]
binding = "KV_CACHE"
id = "6da4fc72343e4286a9080b741ad98bc7"
preview_id = "a808db59def7494d8ad4718dea31cf3b"

# After running: wrangler vectorize create synthire-embeddings --dimensions=1024 --metric=cosine
# IMPORTANT: Before first production deploy, create the companyId metadata index:
# wrangler vectorize create-metadata-index synthire-embeddings --property-name=companyId --type=string
[[vectorize]]
binding = "VECTORIZE"
index_name = "synthire-embeddings"

# Workers AI (built-in, no setup needed)
[ai]
binding = "AI"

# Native rate limiter — local colo counters, costs no KV writes.
# namespace_id must be unique per environment. period must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Scheduled worker for email queue processor (runs every minute)
[triggers]
crons = ["* * * * *"]

